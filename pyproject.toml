[project]
name = "wowsims-mcp"
version = "0.1.0"
description = "MCP tools for looking up World of Warcraft items in the wowsims database"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "mcp>=1.29,<2",
    "pydantic>=2.0",
]

[project.scripts]
wowsims-mcp = "wowsims_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unreachable = true

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]
