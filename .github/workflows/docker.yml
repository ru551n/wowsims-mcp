name: Test and publish MCP container

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Fetch pinned game database
        run: python3 -c 'import re; from pathlib import Path; text=Path("src/wowsims_mcp/constants.py").read_text(); commit=re.search(r"SIM_COMMIT = \"([0-9a-f]+)\"", text).group(1); import subprocess; subprocess.run(["python3", "tools/fetch_database.py", commit, "data/db.json"], check=True)'
      - name: Run Python checks
        run: |
          uv sync
          uv run ruff check .
          uv run mypy
          uv run pytest -q
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/wowsims-mcp
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build candidate container
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: wowsims-mcp:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test container MCP endpoint
        run: |
          docker run -d --name wowsims-mcp -p 8765:8000 wowsims-mcp:candidate
          trap 'docker logs wowsims-mcp; docker rm -f wowsims-mcp' EXIT
          for attempt in $(seq 1 30); do
            if docker logs wowsims-mcp 2>&1 | grep -q 'Uvicorn running on'; then
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' wowsims-mcp | grep -q true; then
              echo 'Container exited before becoming ready.'
              exit 1
            fi
            if [ "$attempt" = 30 ]; then
              echo 'Container did not become ready in time.'
              exit 1
            fi
            sleep 1
          done
          uv run python - <<'PY'
          import asyncio
          from mcp import ClientSession
          from mcp.client.streamable_http import streamable_http_client

          async def main():
              async with streamable_http_client("http://127.0.0.1:8765/mcp") as (read, write, _):
                  async with ClientSession(read, write) as session:
                      await session.initialize()
                      tools = await session.list_tools()
                      assert len(tools.tools) >= 17
                      specs = await session.call_tool("wowsims_list_specs", {})
                      assert specs.structuredContent["ok"]
                      result = await session.call_tool(
                          "wowsims_simulate",
                          {"class": "rogue", "spec": "combat", "race": "troll", "iterations": 10, "duration_s": 30},
                      )
                      assert result.structuredContent["ok"], result.structuredContent
                      assert result.structuredContent["dps"]["mean"] > 0

          asyncio.run(main())
          PY
      - name: Publish tested container
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
